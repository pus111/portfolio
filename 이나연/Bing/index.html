<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="front_header">
      <header class="header">
        <!-- 맨 위 -->
        <div class="header_top">
          <ul class="center">
            <li><a href="#">구매포털시스템</a></li>
            <li><img src="./imgs/link_arrow02.png" alt="arrow1" /></li>

            <li><a href="#">인재채용</a></li>
            <li><img src="./imgs/link_arrow03.png" alt="arrow2" /></li>
          </ul>
        </div>

        <!-- 로고 + 메뉴 + KR + 햄버거 -->
        <div class="container">
          <!-- 로고 -->
          <div class="sec01_logo">
            <img src="./imgs/logo.png" alt="로고" />
          </div>

          <!-- 메뉴 -->
          <nav class="mune">
            <ul class="depth">
              <li><a href="#">회사소개</a></li>
              <li><a href="#">제품소개</a></li>
              <li><a href="#">지속가능경영</a></li>
              <li><a href="#">투자정보</a></li>
              <li><a href="#">뉴스룸</a></li>
              <li><a href="#">고객센터</a></li>
            </ul>
          </nav>

          <!-- 언어 -->
          <div class="right_group">
            <div class="esc03">
              <div class="lang flex">
                <span class="triangle">KR</span>
                <img src="./imgs/lang_btn.png" alt="btn" />
              </div>
            </div>

            <!-- 햄버거 -->
            <div class="hamberger">
              <a href="#">
                <span></span>
                <span></span>
                <span></span>
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- 배경 이미지 -->
      <section class="sec01">
        <div class="bg">
          <img src="./imgs/section1.png" alt="" />
        </div>
        <!-- 검색 창 -->
        <div class="search_wrap">
          <div class="search_box">
            <div class="search">
              <input type="text" placeholder="검색어를 입력해주세요." />
              <button class="search_but">SEARCH</button>
            </div>
          </div>
          <ul class="tag_list">
            <li>#바나나맛우유</li>
            <li>#요플레그릭</li>
            <li>#아카페라</li>
            <li>#더단백</li>
            <li>#딜앨루</li>
          </ul>
        </div>
      </section>

      <!-- 두번째 섹션-->
      <section class="seciton2">
        <div class="sec02">
          <h3 class="sectxt">행복한 빙그래의 맛</h3>

          <!--화살표 버튼 부분-->
          <div class="arrow_left">
            <img src="./imgs/prev_arrow.png" alt="" />
          </div>

          <div class="arrow_rig">
            <img src="./imgs/next_arrow.png" alt="" />
          </div>

          <!--슬라이드 전체 -->
          <div class="slider_wrap">
            <!--실제 움직이는 영역 -->
            <div class="slider">
              <div class="item">
                <img src="./imgs/ice.png" alt="아이스크림" />
                <p class="item_txt">아이스크림</p>
              </div>

              <div class="item">
                <img src="./imgs/milk.png" alt="우유" />
                <p class="item_txt">우유</p>
              </div>

              <div class="item">
                <img src="./imgs/fermentation.png" alt="발효유" />
                <p class="item_txt">발효유</p>
              </div>

              <div class="item">
                <img src="./imgs/coffee.png" alt="커피" />
                <p class="item_txt">커피</p>
              </div>

              <div class="item">
                <img src="./imgs/juice.png" alt="쥬스" />
                <p class="item_txt">쥬스</p>
              </div>

              <div class="item">
                <img src="./imgs/drinkables.png" alt="음료" />
                <p class="item_txt">음료</p>
              </div>

              <div class="item">
                <img src="./imgs/snack.png" alt="스낵" />
                <p class="item_txt">스낵</p>
              </div>

              <div class="item">
                <img src="./imgs/health.png" alt="건강" />
                <p class="item_txt">건강</p>
              </div>

              <div class="item">
                <img src="./imgs/export.png" alt="수출" />
                <p class="item_txt">수출</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
