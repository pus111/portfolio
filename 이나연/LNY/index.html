<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2025 Portfolio</title>
  </head>
<style>
  body {
  margin: 0;
  padding: 0;
  background: #F7F3F3;
  font-family: "Pretendard", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.wrap {
  text-align: center;
}


/* 타이틀 */
h1 {
  font-size: 32px;
  margin-top: 18px;
  margin-bottom: 30px;
  color: #222;
}

/* 태그 박스 */
.tag-box {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

.tag {
  padding: 10px 22px;
  background: #F4EDE8;
  border-radius: 40px;
  border: 1px solid #CBBDB9;
  font-size: 15px;
  cursor: default;
}
.iconcolor img{
  width: 100px;
  height: 100px;
}
/* 강조 태그 */
.tag.highlight {
  background: #FFCB62;
  color: #222;
  border: none;
  font-weight: 600;
}

/* 푸터 */
footer {
  position: fixed;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  color: #666;
}
.st0{fill:#EF2525;}
.iconcolor svg{
  transform: scale(3); 
}
</style>
  <body>
    <div class="wrap">
      <!-- 폴더 아이콘 -->
      <div class="folder-icon">
        <div class="iconcolor">

<svg>

<path class="st0" d="M4,20c-0.5,0-1-0.2-1.4-0.6S2,18.5,2,18V6c0-0.5,0.2-1,0.6-1.4C3,4.2,3.5,4,4,4h6l2,2h8c0.6,0,1,0.2,1.4,0.6
	C21.8,7,22,7.4,22,8H11.2l-2-2H4v12l2.4-8h17.1l-2.6,8.6c-0.1,0.4-0.4,0.8-0.7,1C19.8,19.9,19.4,20,19,20H4z M6.1,18H19l1.8-6H7.9
	L6.1,18z M6.1,18l1.8-6L6.1,18z M4,8V6V8z"/>
</svg>


</div>
      <!-- 타이틀 -->
      <h1>PORTFOLIO</h1>

      <!-- 태그들 -->
      <div class="tag-box">
        <div class="tag">신입의 자세</div>
        <div class="tag">아직도 배우는 중…</div>
        <div class="tag">오늘도 전진 중</div>
        <div class="tag highlight">열정과 긍정</div>
      </div>
    </div>

    <footer>web Publisher</footer>
  </body>
</html>
